# Home Assistant MQTT entities for the Ducato X250 body CAN, fed by wican/can_filter.json.
# Include from configuration.yaml with:   mqtt: !include mqtt_wican.yaml
# Replace <device_id> with your WiCAN id (the topic is shown in the WiCAN web UI).
#
# expire_after: the bus goes silent with the key out, so live values turn "unavailable"
# 15 s after the last frame instead of freezing on a stale value.

sensor:
  - name: "Ducato Speed"
    unique_id: ducato_speed
    state_topic: "wican/<device_id>/can/rx"
    value_template: "{{ value_json.speed_kmh if value_json.speed_kmh is defined }}"
    expire_after: 15
    unit_of_measurement: "km/h"
    device_class: speed
    state_class: measurement
    suggested_display_precision: 0

  - name: "Ducato RPM"
    unique_id: ducato_rpm
    state_topic: "wican/<device_id>/can/rx"
    value_template: "{{ value_json.rpm if value_json.rpm is defined }}"
    expire_after: 15
    unit_of_measurement: "rpm"
    state_class: measurement
    suggested_display_precision: 0
    icon: mdi:engine

  - name: "Ducato Coolant Temperature"
    unique_id: ducato_coolant_temperature
    state_topic: "wican/<device_id>/can/rx"
    value_template: "{{ value_json.coolant_c if value_json.coolant_c is defined }}"
    expire_after: 15
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    suggested_display_precision: 0

  # No expire_after on odometer / range: they keep their last value while parked.
  - name: "Ducato Odometer"
    unique_id: ducato_odometer
    state_topic: "wican/<device_id>/can/rx"
    value_template: "{{ value_json.odometer_km if value_json.odometer_km is defined }}"
    unit_of_measurement: "km"
    device_class: distance
    state_class: total_increasing
    suggested_display_precision: 0

  - name: "Ducato Range"
    unique_id: ducato_range
    state_topic: "wican/<device_id>/can/rx"
    value_template: "{{ value_json.range_km if value_json.range_km is defined }}"
    unit_of_measurement: "km"
    device_class: distance
    suggested_display_precision: 0
    icon: mdi:gas-station-in-use

  # Raw 0x180 (b0<<16 | b1<<8 | b2), used by the turn-signal templates.
  - name: "Ducato 0x180 raw"
    unique_id: ducato_0x180_raw
    state_topic: "wican/<device_id>/can/rx"
    value_template: "{{ value_json.raw_180 | int if value_json.raw_180 is defined }}"
    expire_after: 15

  # Trip computer. Digits are BCD: 0x116 = 11.6 L/100km. Each WiCAN filter arrives
  # as its own message, so every sensor reads a single raw filter.
  # To be verified while driving. 0 with the engine off (the cluster keeps a fixed value at standstill).
  - name: "Ducato Instant Consumption"
    unique_id: ducato_instant_consumption
    state_topic: "wican/<device_id>/can/rx"
    value_template: >-
      {% if value_json.raw_603_b01 is defined %}{% if is_state('binary_sensor.ducato_engine_running', 'on') %}{% set d = (value_json.raw_603_b01 | int) // 16 %}
      {{ (d // 256) % 16 * 10 + (d // 16) % 16 + (d % 16) / 10 }}{% else %}0{% endif %}{% endif %}
    unit_of_measurement: "L/100km"
    icon: mdi:gauge

  - name: "Ducato Trip Average Consumption"
    unique_id: ducato_trip_avg_consumption
    state_topic: "wican/<device_id>/can/rx"
    value_template: >-
      {% if value_json.raw_643_a is defined %}{% set d = (value_json.raw_643_a | int) // 1048576 %}
      {{ (d // 256) % 16 * 10 + (d // 16) % 16 + (d % 16) / 10 }}{% endif %}
    unit_of_measurement: "L/100km"
    icon: mdi:gas-station

  - name: "Ducato Trip Average Speed"
    unique_id: ducato_trip_avg_speed
    state_topic: "wican/<device_id>/can/rx"
    value_template: "{{ ((value_json.raw_643_a | int) // 256) % 256 if value_json.raw_643_a is defined }}"
    unit_of_measurement: "km/h"
    device_class: speed
    suggested_display_precision: 0

  - name: "Ducato Trip Time"
    unique_id: ducato_trip_time
    state_topic: "wican/<device_id>/can/rx"
    value_template: >-
      {% if value_json.raw_643_hm is defined %}{% set h = (value_json.raw_643_hm | int) // 256 %}{% set m = (value_json.raw_643_hm | int) % 256 %}
      {{ ((h // 16 * 10 + h % 16) + (m // 16 * 10 + m % 16) / 60) | round(2) }}{% endif %}
    unit_of_measurement: "h"
    device_class: duration
    suggested_display_precision: 1

  - name: "Ducato Trip Distance"
    unique_id: ducato_trip_distance
    state_topic: "wican/<device_id>/can/rx"
    value_template: "{{ ((value_json.raw_643_b | int) % 16777216 // 16) / 10 if value_json.raw_643_b is defined }}"
    unit_of_measurement: "km"
    device_class: distance
    suggested_display_precision: 1

binary_sensor:
  - name: "Ducato Engine Running"
    unique_id: ducato_engine_running
    state_topic: "wican/<device_id>/can/rx"
    # From RPM: the 0x281 b1 bit7 flag reads "running" at key-off and during the ECU after-run.
    value_template: "{{ ('ON' if value_json.rpm > 300 else 'OFF') if value_json.rpm is defined }}"
    expire_after: 15
    device_class: running

  - name: "Ducato Doors"
    unique_id: ducato_doors
    state_topic: "wican/<device_id>/can/rx"
    value_template: "{{ ('ON' if value_json.doors > 0 else 'OFF') if value_json.doors is defined }}"
    expire_after: 15
    device_class: door

  - name: "Ducato Parking Brake"
    unique_id: ducato_parking_brake
    state_topic: "wican/<device_id>/can/rx"
    value_template: "{{ ('ON' if value_json.parking_brake > 0.5 else 'OFF') if value_json.parking_brake is defined }}"
    expire_after: 15
    icon: mdi:car-brake-parking

  # 0x180 bits: b0 bit7 brake pedal (0x800000), b1 bit5 side lights (0x2000),
  # b1 bit3 dipped beam (0x0800), b1 bit4 main beam (0x1000), b1 bit1 rear fog (0x0200)
  - name: "Ducato Brake Pedal"
    unique_id: ducato_brake_pedal
    state_topic: "wican/<device_id>/can/rx"
    value_template: "{{ ('ON' if (value_json.raw_180 | int | bitwise_and(8388608)) > 0 else 'OFF') if value_json.raw_180 is defined }}"
    expire_after: 15
    icon: mdi:car-brake-alert

  - name: "Ducato Side Lights"
    unique_id: ducato_side_lights
    state_topic: "wican/<device_id>/can/rx"
    value_template: "{{ ('ON' if (value_json.raw_180 | int | bitwise_and(8192)) > 0 else 'OFF') if value_json.raw_180 is defined }}"
    expire_after: 15
    device_class: light
    icon: mdi:car-parking-lights

  - name: "Ducato Dipped Beam"
    unique_id: ducato_dipped_beam
    state_topic: "wican/<device_id>/can/rx"
    value_template: "{{ ('ON' if (value_json.raw_180 | int | bitwise_and(2048)) > 0 else 'OFF') if value_json.raw_180 is defined }}"
    expire_after: 15
    device_class: light
    icon: mdi:car-light-dimmed

  - name: "Ducato Main Beam"
    unique_id: ducato_main_beam
    state_topic: "wican/<device_id>/can/rx"
    value_template: "{{ ('ON' if (value_json.raw_180 | int | bitwise_and(4096)) > 0 else 'OFF') if value_json.raw_180 is defined }}"
    expire_after: 15
    device_class: light
    icon: mdi:car-light-high

  - name: "Ducato Rear Fog Light"
    unique_id: ducato_rear_fog_light
    state_topic: "wican/<device_id>/can/rx"
    value_template: "{{ ('ON' if (value_json.raw_180 | int | bitwise_and(512)) > 0 else 'OFF') if value_json.raw_180 is defined }}"
    expire_after: 15
    device_class: light
    icon: mdi:car-light-fog

  # 0x380 b2 bit2 = reverse gear
  - name: "Ducato Reverse"
    unique_id: ducato_reverse
    state_topic: "wican/<device_id>/can/rx"
    value_template: "{{ ('ON' if (value_json.raw_380_b2 | int | bitwise_and(4)) > 0 else 'OFF') if value_json.raw_380_b2 is defined }}"
    expire_after: 15
    icon: mdi:car-back

  # 0x39A b2 bit0 = driver seatbelt, 1 = unbuckled (problem = "belt not fastened")
  - name: "Ducato Driver Seatbelt"
    unique_id: ducato_driver_seatbelt
    state_topic: "wican/<device_id>/can/rx"
    value_template: "{{ ('ON' if (value_json.raw_39a_b2 | int | bitwise_and(1)) > 0 else 'OFF') if value_json.raw_39a_b2 is defined }}"
    expire_after: 15
    device_class: problem
    icon: mdi:seatbelt
