<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="720" height="330" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">OBD-II socket, Ducato X250 (2009) — looking into the socket</text>
  <!-- trapezoid body -->
  <path d="M120,60 L600,60 L570,190 L150,190 Z" fill="#374151" stroke="#111" stroke-width="2"/>
  <!-- pins row 1: 1..8, row 2: 9..16 -->
  <g font-size="11" text-anchor="middle">
    <!-- row 1 -->
    <circle cx="170" cy="100" r="13" fill="#9ca3af"/><text x="170" y="104">1</text>
    <circle cx="225" cy="100" r="13" fill="#9ca3af"/><text x="225" y="104">2</text>
    <circle cx="280" cy="100" r="13" fill="#9ca3af"/><text x="280" y="104">3</text>
    <circle cx="335" cy="100" r="13" fill="#111827" stroke="#fff"/><text x="335" y="104" fill="#fff">4</text>
    <circle cx="390" cy="100" r="13" fill="#111827" stroke="#fff"/><text x="390" y="104" fill="#fff">5</text>
    <circle cx="445" cy="100" r="13" fill="#3b82f6"/><text x="445" y="104" fill="#fff">6</text>
    <circle cx="500" cy="100" r="13" fill="#ef4444"/><text x="500" y="104" fill="#fff">7</text>
    <circle cx="555" cy="100" r="13" fill="#9ca3af"/><text x="555" y="104">8</text>
    <!-- row 2 -->
    <circle cx="185" cy="150" r="13" fill="#9ca3af"/><text x="185" y="154">9</text>
    <circle cx="237" cy="150" r="13" fill="#9ca3af"/><text x="237" y="154">10</text>
    <circle cx="289" cy="150" r="13" fill="#9ca3af"/><text x="289" y="154">11</text>
    <circle cx="341" cy="150" r="13" fill="#9ca3af"/><text x="341" y="154">12</text>
    <circle cx="393" cy="150" r="13" fill="#9ca3af"/><text x="393" y="154">13</text>
    <circle cx="445" cy="150" r="13" fill="#3b82f6"/><text x="445" y="154" fill="#fff">14</text>
    <circle cx="497" cy="150" r="13" fill="#9ca3af"/><text x="497" y="154">15</text>
    <circle cx="549" cy="150" r="13" fill="#f59e0b"/><text x="549" y="154">16</text>
  </g>
  <!-- legend -->
  <g>
    <circle cx="60" cy="232" r="8" fill="#3b82f6"/>
    <text x="76" y="237" fill="#222"><tspan font-weight="bold">6 = CAN-H, 14 = CAN-L</tspan> → body CAN (B-CAN), <tspan font-weight="bold">50 kbit/s</tspan>. This is what the WiCAN reads. 500 kbit/s = silence.</text>
    <circle cx="60" cy="258" r="8" fill="#ef4444"/>
    <text x="76" y="263" fill="#222"><tspan font-weight="bold">7 = K-line</tspan> → engine ECU, ISO 14230-4 KWP2000 fast init (what Torque/ELM327 use for OBD PIDs).</text>
    <circle cx="60" cy="284" r="8" fill="#111827"/>
    <text x="76" y="289" fill="#222"><tspan font-weight="bold">4 / 5 = ground</tspan>   </text>
    <circle cx="220" cy="284" r="8" fill="#f59e0b"/>
    <text x="236" y="289" fill="#222"><tspan font-weight="bold">16 = +12 V permanent</tspan> (the dongle stays powered with the key out)</text>
    <text x="360" y="318" text-anchor="middle" fill="#777" font-size="11">Socket sits under the dashboard, left of the steering column, next to the fuse box.</text>
  </g>
</svg>
