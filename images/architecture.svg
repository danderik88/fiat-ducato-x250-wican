<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="900" height="400" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Fiat Ducato X250 (2009) → WiCAN → MQTT → Home Assistant</text>

  <!-- vehicle -->
  <rect x="20" y="60" width="220" height="250" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="130" y="84" text-anchor="middle" font-weight="bold" fill="#222">Vehicle</text>
  <rect x="40" y="100" width="180" height="70" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="130" y="124" text-anchor="middle" fill="#1e3a8a">Body CAN (B-CAN)</text>
  <text x="130" y="142" text-anchor="middle" fill="#1e3a8a" font-size="12">50 kbit/s · 18 IDs · ~90 fr/s</text>
  <text x="130" y="158" text-anchor="middle" fill="#1e3a8a" font-size="12">OBD pins 6 / 14</text>
  <rect x="40" y="190" width="180" height="70" rx="6" fill="#fee2e2" stroke="#ef4444"/>
  <text x="130" y="214" text-anchor="middle" fill="#7f1d1d">Engine ECU</text>
  <text x="130" y="232" text-anchor="middle" fill="#7f1d1d" font-size="12">K-line, ISO 14230 (KWP2000)</text>
  <text x="130" y="248" text-anchor="middle" fill="#7f1d1d" font-size="12">OBD pin 7 — not reachable</text>
  <text x="130" y="290" text-anchor="middle" fill="#555" font-size="12">bus is silent with the key out</text>

  <!-- wican -->
  <rect x="300" y="100" width="170" height="110" rx="10" fill="#ecfdf5" stroke="#10b981"/>
  <text x="385" y="126" text-anchor="middle" font-weight="bold" fill="#065f46">WiCAN (MeatPi)</text>
  <text x="385" y="146" text-anchor="middle" fill="#065f46" font-size="12">OBD version, non-Pro</text>
  <text x="385" y="164" text-anchor="middle" fill="#065f46" font-size="12">listen-only (silent)</text>
  <text x="385" y="182" text-anchor="middle" fill="#065f46" font-size="12">MQTT filter decodes</text>
  <text x="385" y="198" text-anchor="middle" fill="#065f46" font-size="12">signals on the dongle</text>

  <!-- broker -->
  <rect x="530" y="100" width="150" height="110" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="605" y="130" text-anchor="middle" font-weight="bold" fill="#78350f">MQTT broker</text>
  <text x="605" y="152" text-anchor="middle" fill="#78350f" font-size="12">e.g. Mosquitto</text>
  <text x="605" y="174" text-anchor="middle" fill="#78350f" font-size="12">wican/&lt;id&gt;/can/rx</text>
  <text x="605" y="190" text-anchor="middle" fill="#78350f" font-size="12">{"rpm": 830, ...}</text>

  <!-- HA -->
  <rect x="740" y="100" width="140" height="110" rx="10" fill="#e0f2fe" stroke="#0ea5e9"/>
  <text x="810" y="130" text-anchor="middle" font-weight="bold" fill="#0c4a6e">Home Assistant</text>
  <text x="810" y="152" text-anchor="middle" fill="#0c4a6e" font-size="12">MQTT sensors</text>
  <text x="810" y="170" text-anchor="middle" fill="#0c4a6e" font-size="12">binary_sensors</text>
  <text x="810" y="188" text-anchor="middle" fill="#0c4a6e" font-size="12">dashboards</text>

  <line x1="220" y1="135" x2="298" y2="140" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="220" y1="225" x2="298" y2="190" stroke="#bbb" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="262" y="228" text-anchor="middle" fill="#999" font-size="16">✕</text>
  <line x1="470" y1="155" x2="528" y2="155" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="499" y="146" text-anchor="middle" fill="#555" font-size="11">WiFi</text>
  <line x1="680" y1="155" x2="738" y2="155" stroke="#333" stroke-width="2" marker-end="url(#a)"/>

  <text x="450" y="345" text-anchor="middle" fill="#333" font-size="13">Readable from the body CAN: speed, RPM, coolant temp, engine running, odometer, range, fuel,</text>
  <text x="450" y="365" text-anchor="middle" fill="#333" font-size="13">doors, parking brake, brake pedal, side/dipped/main beam, turn signals, dashboard clock.</text>
  <text x="450" y="388" text-anchor="middle" fill="#777" font-size="12">Boost, engine load and ECU voltage live only on the K-line: use a K-line ELM327 (e.g. Torque) or a WiCAN Pro.</text>
</svg>
